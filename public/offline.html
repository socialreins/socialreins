<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf8f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>You are offline: SocialReins</title>
<style>
  :root { color-scheme: light dark; --bg: #faf8f6; --ink: #121212; --soft: #57534e; --accent: #c2330a; --line: rgb(18 18 18 / 0.12); }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --ink: #f5f2ee; --soft: #b5aea6; --accent: #ff5b22; --line: rgb(245 242 238 / 0.16); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 1.0625rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display: grid; gap: 1rem; justify-items: start; max-width: 30rem; }
  svg { width: 3.5rem; height: 3.5rem; border-radius: 0.8rem; }
  h1 { margin: 0; font-size: 2rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--soft); }
  button { font: inherit; font-weight: 700; padding: 0.7rem 1.4rem; cursor: pointer; color: var(--bg); background: var(--ink); border: 2px solid var(--ink); border-radius: 999px; }
  button:hover { background: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" role="img" aria-label="SocialReins"><rect width="64" height="64" fill="#121212"/><path d="M14 14 H50 V40 H30 L20 50 V40 H14 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/><path d="M24 27 C32 22 40 32 48 27 C53 24 56 22 58 22" fill="none" stroke="#ff5b22" stroke-width="4.5" stroke-linecap="round"/></svg>
  <h1>You are offline</h1>
  <p>SocialReins needs a connection to load your posts and accounts. Nothing you scheduled is lost: it goes out on time from the server.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
